[project]
name = "freepik-tryon-bot"
version = "0.1.0"
description = "Telegram bot: Mannequin Tryon & Hanger outfit replacement (Aksara Strategy)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bunskii" }]
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.6,<22",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "Pillow>=10.0,<13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "reportlab>=4.0,<5",
]

[project.scripts]
freepik-tryon-bot = "freepik_tryon_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freepik_tryon_bot"]

[tool.hatch.build.targets.wheel.force-include]
"freepik_tryon_bot/assets" = "freepik_tryon_bot/assets"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
